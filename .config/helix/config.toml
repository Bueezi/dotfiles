# theme = "gruvbox_light"
# theme = "adwaita-dark"
theme = "gruber-darker"

[editor]
completion-trigger-len = 1
idle-timeout = 50
completion-timeout = 5
soft-wrap.enable = true
bufferline = "multiple"
end-of-line-diagnostics = "disable" #"hint"
inline-diagnostics.cursor-line = "disable"
lsp.display-inlay-hints = true
indent-guides.render = true
# cursor-shape.insert = "bar"
line-number = "relative"

[editor.auto-save]
focus-lost = true

[keys.normal.space]
x = ":toggle end-of-line-diagnostics hint disable"
# Shell pane below, in the file's folder; hides and comes back as it was (helix/term.sh)
t = ':sh sh ~/.config/helix/term.sh "$(dirname "$(realpath "%{buffer_name}")")"'
# Save, compile and run in a pane below, reused on rerun (helix/run.sh); M asks for arguments
m = [":w", ':sh sh ~/.config/helix/term.sh run "$(realpath "%{buffer_name}")"']
M = [":w", ':sh sh ~/.config/helix/term.sh run "$(realpath "%{buffer_name}")" ask']
