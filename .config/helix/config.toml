# theme = "gruvbox_light"
# theme = "adwaita-dark"
theme = "gruber-darker"

[editor]
completion-trigger-len = 1
idle-timeout = 50
completion-timeout = 5
soft-wrap.enable = true
bufferline = "multiple"
end-of-line-diagnostics = "disable" #"hint"
inline-diagnostics.cursor-line = "disable"
lsp.display-inlay-hints = true
indent-guides.render = true
# cursor-shape.insert = "bar"
line-number = "relative"

[editor.auto-save]
focus-lost = true

[keys.normal.space]
x = ":toggle end-of-line-diagnostics hint disable"
# Save, compile and run in the Alt+t shell pane (tmux/term.sh); M asks for arguments
m = [":w", ':sh sh ~/.config/tmux/term.sh run "$TMUX_PANE" "$(realpath "%{buffer_name}")"']
M = [":w", ':sh sh ~/.config/tmux/term.sh run "$TMUX_PANE" "$(realpath "%{buffer_name}")" ask']
