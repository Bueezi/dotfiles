# theme = "gruvbox_light"
# theme = "adwaita-dark"
theme = "gruber-darker"

[editor]
completion-trigger-len = 1
idle-timeout = 50
completion-timeout = 5
soft-wrap.enable = true
bufferline = "multiple"
end-of-line-diagnostics = "disable" #"hint"
inline-diagnostics.cursor-line = "disable"
lsp.display-inlay-hints = true
indent-guides.render = true
# cursor-shape.insert = "bar"
line-number = "relative"

[editor.auto-save]
focus-lost = true

[keys.normal.space]
x = ":toggle end-of-line-diagnostics hint disable"
# tmux pane below, in the file's folder
t = ':sh tmux split-window -v -l 15 -c "$(dirname "$(realpath "%{buffer_name}")")"'
# Save, compile and run in a tmux pop-up (helix/run.sh); M asks for arguments
m = [":w", ':sh tmux display-popup -E -w 90%% -h 90%% sh ~/.config/helix/run.sh "$(realpath "%{buffer_name}")"']
M = [":w", ':sh tmux display-popup -E -w 90%% -h 90%% sh ~/.config/helix/run.sh "$(realpath "%{buffer_name}")" ask']
