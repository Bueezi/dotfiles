# basedpyright and tailwindcss-ls are Helix built-ins; only which languages use them is set here
[[language]]
name = "python"
language-servers = ["basedpyright"]

# Tailwind class completion next to the usual servers (only kicks in in Tailwind projects)
[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "tailwindcss-ls"]

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-ls"]

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "tailwindcss-ls"]

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "tailwindcss-ls"]

# SQL: Helix has no default. sqls completes keywords; tables/columns need a connection in
# ~/.config/sqls/config.yml
[language-server.sqls]
command = "sqls"

[[language]]
name = "sql"
language-servers = ["sqls"]
