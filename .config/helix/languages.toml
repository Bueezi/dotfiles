# basedpyright and tailwindcss-ls are Helix built-ins; only which languages use them is set here
[[language]]
name = "python"
language-servers = ["basedpyright"]

# Emmet: Helix doesn't close tags, so `div.card` + completion writes `<div class="card"></div>`.
[language-server.emmet]
command = "emmet-language-server"
args = ["--stdio"]

# Tailwind class completion next to the usual servers (only kicks in in Tailwind projects)
[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "emmet", "tailwindcss-ls"]

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-ls"]

# JS: on save only add missing semicolons (ESLint `semi` rule), no other formatting.
# (eslint from dev.nix)
[[language]]
name = "javascript"
auto-format = true
formatter = { command = "node", args = ["/home/ben/.config/helix/semi.mjs"] }

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "tailwindcss-ls"]

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "tailwindcss-ls"]

# SQL: Helix has no default. sqls completes keywords; tables/columns need a connection in
# ~/.config/sqls/config.yml
[language-server.sqls]
command = "sqls"

[[language]]
name = "sql"
language-servers = ["sqls"]

[[language]]
name = "latex"
soft-wrap.enable = true
