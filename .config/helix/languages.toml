[[language]]
name = "python"
language-servers = ["basedpyright"]

[language-server.emmet]
command = "emmet-language-server"
args = ["--stdio"]

[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "emmet", "tailwindcss-ls"]

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-ls"]

# On save: only missing semicolons
[[language]]
name = "javascript"
auto-format = true
formatter = { command = "node", args = ["/home/ben/.config/helix/semi.mjs"] }

[[language]]
name = "c"
auto-format = true
formatter = { command = "python3", args = ["-I", "/home/ben/.config/helix/semi-c.py", "c"] }

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "python3", args = ["-I", "/home/ben/.config/helix/semi-c.py", "c++"] }

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "tailwindcss-ls"]

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "tailwindcss-ls"]

# Tables/columns need a connection in ~/.config/sqls/config.yml
[language-server.sqls]
command = "sqls"

[[language]]
name = "sql"
language-servers = ["sqls"]

[[language]]
name = "latex"
soft-wrap.enable = true
