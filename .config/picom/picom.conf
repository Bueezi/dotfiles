# picom on the tablet: what SwayFX does on the desktop. Rounded corners, shadows, and blur behind
# everything see-through (the bar, rofi, dunst, alacritty). The GL backend runs on the GPU (Zink);
# i3's autostart falls back to xrender (no blur) if it fails.
backend = "glx";
vsync = true;

corner-radius = 6;
rounded-corners-exclude = [ "class_g = 'i3bar'" ];

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.8;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-exclude = [ "class_g = 'i3bar'" ];

blur: {
    method = "dual_kawase";
    strength = 4;
};

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
