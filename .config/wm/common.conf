# Shared by sway (~/.config/wm/sway) and i3 (~/.config/wm/i3): the looks and the window keys.
# Only syntax both understand: plain `bindsym` lines (i3 has no `bindsym { }` blocks), `split h`
# instead of `splith`, "60 px" with a space. Each WM sets $mod, $term, $term_float, $menu, $fm and
# $scripts before including this, then adds its own keys, rules and bar. The scripts bound here
# work in both (they check $SWAYSOCK); sway-only ones are bound in wm/sway. i3 can't use variables set here in
# its own file (sway can): the colour variables below are for this file and sway.
# Cheatsheet sections (keybinds.sh): a comment of one or two words, like `# Focus`.

set $left    h
set $down    j
set $up      k
set $right   l

set $bg      #000000
set $fg      #ffffff
set $dim     #777777
set $subtle  #333333

# ── Appearance ──────────────────────────────────────
font pango:JetBrainsMono Nerd Font 10

# class                 border   bg    text  indicator child_border
client.focused          $fg      $bg   $fg   $fg       $fg
client.focused_inactive $subtle  $bg   $dim  $subtle   $subtle
client.unfocused        $subtle  $bg   $dim  $subtle   $subtle
client.urgent           $fg      $fg   $bg   $fg       $fg

default_border          pixel 2
default_floating_border pixel 2
# Title bars (tabbed/stacked): centred text
title_align             center
smart_borders on
gaps inner 5
smart_gaps on

# $mod + left drag = move, $mod + right drag = resize
floating_modifier $mod
focus_on_window_activation focus

# ── Keys ────────────────────────────────────────────
# Apps
bindsym $mod+Return         exec $term
# A new floating terminal each press (each WM's scratch rule: floating, in the scratchpad)
bindsym $mod+Shift+Return   exec $term_float
bindsym $mod+d              exec $menu
# A new floating file manager each press (same rule)
bindsym $mod+Shift+e        exec $fm
# Eclipse Music (web app, ~/.config/nixos/webapps): each press shows/hides it, starting it if needed
bindsym $mod+m              exec eclipse
# KU Leuven's Toledo: a tab in LibreWolf
bindsym $mod+u              exec librewolf https://toledo.kuleuven.be/portal/

# Scripts
bindsym $mod+Shift+v        exec $scripts/clipboard.sh
bindsym $mod+Shift+s        exec $scripts/screenshot.sh
bindsym $mod+Shift+x        exec $scripts/screenshot.sh ocr
bindsym $mod+Shift+t        exec $scripts/darkmode.sh
bindsym $mod+Shift+p        exec $scripts/power.sh
bindsym $mod+slash          exec $scripts/keybinds.sh

# Session
bindsym $mod+q              kill
bindsym $mod+Shift+c        reload

# Focus
bindsym $mod+$left          focus left
bindsym $mod+$down          focus down
bindsym $mod+$up            focus up
bindsym $mod+$right         focus right
bindsym $mod+Left           focus left
bindsym $mod+Down           focus down
bindsym $mod+Up             focus up
bindsym $mod+Right          focus right

# Move window
# 60 px per press for floating windows (default 10); tiled ones just swap places
bindsym $mod+Shift+$left    move left 60 px
bindsym $mod+Shift+$down    move down 60 px
bindsym $mod+Shift+$up      move up 60 px
bindsym $mod+Shift+$right   move right 60 px
bindsym $mod+Shift+Left     move left 60 px
bindsym $mod+Shift+Down     move down 60 px
bindsym $mod+Shift+Up       move up 60 px
bindsym $mod+Shift+Right    move right 60 px

# Workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Layout
bindsym $mod+v              split h
bindsym $mod+c              split v
bindsym $mod+s              layout stacking
bindsym $mod+w              layout tabbed
bindsym $mod+e              layout toggle split
bindsym $mod+f              fullscreen
bindsym $mod+Shift+space    floating toggle
bindsym $mod+space          focus mode_toggle
bindsym $mod+a              focus parent

# Scratchpad
bindsym $mod+Shift+minus    move scratchpad
bindsym $mod+minus          scratchpad show

bindsym $mod+r              mode "resize"

mode "resize" {
    bindsym $left   resize shrink width 10 px
    bindsym $down   resize grow height 10 px
    bindsym $up     resize shrink height 10 px
    bindsym $right  resize grow width 10 px
    bindsym Left    resize shrink width 10 px
    bindsym Down    resize grow height 10 px
    bindsym Up      resize shrink height 10 px
    bindsym Right   resize grow width 10 px
    bindsym Return  mode "default"
    bindsym Escape  mode "default"
}
