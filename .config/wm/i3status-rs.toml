[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#00000000"   # see-through: the bar behind is blurred
idle_fg = "#ffffff"
info_bg = "#00000000"
info_fg = "#ffffff"
good_bg = "#00000000"
good_fg = "#ffffff"
warning_bg = "#00000000"
warning_fg = "#aaaaaa"
critical_bg = "#ffffff"
critical_fg = "#000000"
separator = " "
separator_bg = "#00000000"
separator_fg = "#333333"

[icons]
icons = "material-nf"

[[block]]
block = "sound"
format = "vol: {$volume|} "
# Not on the tablet: Termux's PulseAudio has its own volume, Android's is below
if_command = "[ -z \"$TERMUX_VERSION\" ]"

# Tablet: Android's media volume (Termux:API, like the battery)
[[block]]
block = "custom"
command = "termux-volume | jq -r '.[] | select(.stream == \"music\") | \"vol: \\(.volume * 100 / .max_volume | floor)%\"'"
format = "$text "
interval = 5
if_command = "[ -n \"$TERMUX_VERSION\" ]"

[[block]]
block = "battery"
interval = 30
format = "bat: $percentage "
if_command = "ls /sys/class/power_supply/BAT* 2>/dev/null | grep -q ."

# Tablet: Android hides /sys/class/power_supply from apps; Termux:API reads the battery instead
# (needs the Termux:API app). Same "bat: N%" as above, highlighted when low
[[block]]
block = "custom"
command = "termux-battery-status | jq -c '{text: \"bat: \\(.percentage)%\", state: (if .percentage <= 10 then \"Critical\" elif .percentage <= 20 then \"Warning\" else \"Idle\" end)}'"
json = true
format = "$text "
interval = 60
if_command = "[ -n \"$TERMUX_VERSION\" ]"

[[block]]
block = "backlight"
format = "bl: $brightness "
if_command = "ls /sys/class/power_supply/BAT* 2>/dev/null | grep -q ."
[[block.click]]
button = "left"

# Tablet: Android hides the backlight too; its brightness setting (0-255) is readable. Hidden if
# Android refuses
[[block]]
block = "custom"
command = "b=$(settings get system screen_brightness 2>/dev/null) && [ -n \"$b\" ] && echo \"bl: $(( b * 100 / 255 ))%\""
format = "$text "
interval = 10
hide_when_empty = true
if_command = "[ -n \"$TERMUX_VERSION\" ]"

# Desktop: the monitor's brightness over DDC/CI, from osd.sh's cached level (it sends signal 3
# on every change; interval: changes made with the monitor's own buttons)
[[block]]
block = "custom"
command = "~/.config/wm/scripts/osd.sh brightness status"
format = "bl: $text "
signal = 3
interval = 60
hide_when_empty = true
if_command = "[ -n \"$SWAYSOCK\" ] && ! ls /sys/class/power_supply/BAT* 2>/dev/null | grep -q ."

[[block]]
block = "time"
interval = 5
format = "$timestamp.datetime(f:'%a  %d/%m   %R ')"

[[block]]
block = "custom"
command = "~/.config/wm/scripts/toggle.sh caffeine status"
# sway only: the tablet has no swayidle/wlsunset (Android does both)
if_command = "[ -n \"$SWAYSOCK\" ]"
json = true
signal = 1
interval = 5
hide_when_empty = true
[[block.click]]
button = "left"
cmd = "~/.config/wm/scripts/toggle.sh caffeine"

[[block]]
block = "custom"
command = "~/.config/wm/scripts/toggle.sh nightlight status"
# sway only: the tablet has no swayidle/wlsunset (Android does both)
if_command = "[ -n \"$SWAYSOCK\" ]"
json = true
signal = 2
interval = 5
hide_when_empty = true
[[block.click]]
button = "left"
cmd = "~/.config/wm/scripts/toggle.sh nightlight"
