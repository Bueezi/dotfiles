[theme]
theme = "plain"
[theme.overrides]
# The tablet's i3bar. "none": no background of their own, the bar's shows. A clear colour instead
# cut a hole through i3bar's tint (it paints blocks over the bar, not blended)
idle_bg = "none"
idle_fg = "#ffffff"
info_bg = "none"
info_fg = "#ffffff"
good_bg = "none"
good_fg = "#ffffff"
warning_bg = "none"
warning_fg = "#aaaaaa"
critical_bg = "#ffffff"
critical_fg = "#000000"
separator = " "
separator_bg = "none"
separator_fg = "#333333"

[icons]
icons = "material-nf"

# Tablet: Android's media volume (Termux:API, like the battery)
[[block]]
block = "custom"
command = "termux-volume | jq -r '.[] | select(.stream == \"music\") | \"vol: \\(.volume * 100 / .max_volume | floor)%\"'"
format = "$text "
interval = 2
if_command = "[ -n \"$TERMUX_VERSION\" ]"

# Tablet: Android hides /sys/class/power_supply from apps; Termux:API reads the battery instead
# (needs the Termux:API app). Highlighted when low
[[block]]
block = "custom"
command = "termux-battery-status | jq -c '{text: \"bat: \\(.percentage)%\", state: (if .percentage <= 10 then \"Critical\" elif .percentage <= 20 then \"Warning\" else \"Idle\" end)}'"
json = true
format = "$text "
interval = 60
if_command = "[ -n \"$TERMUX_VERSION\" ]"

[[block]]
block = "time"
interval = 5
format = "$timestamp.datetime(f:'%a  %d/%m   %R ')"
