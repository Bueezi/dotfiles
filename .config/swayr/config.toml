# swayr: LRU window switcher. Alt+Tab uses next-window (no menu); the fuzzel menu
# below is only used by the menu commands (e.g. `swayr switch-window`).
# fuzzel has no pango markup or swayr-style icons, so formats are plain text.
# Each line must be unique: swayr maps the picked line back to a window.

[menu]
executable = 'fuzzel'
args = ['--dmenu', '--width=70', '--prompt={prompt} ❯ ']

[format]
output_format    = 'Output {name}  ({id})'
workspace_format = '{indent}Workspace {name} [{layout}] on {output_name}  ({id})'
container_format = '{indent}Container [{layout}] {marks} on workspace {workspace_name}  ({id})'
window_format    = '{indent}{urgency_start}{app_name:{:<12.12}} {title:{:.60}…}{urgency_end}  [{workspace_name}]  ({id})'
indent           = '    '
urgency_start    = '! '
urgency_end      = ''
html_escape      = false
icon_dirs        = []
fallback_icon    = ''

[layout]
auto_tile = false
auto_tile_min_window_width_per_output_width = [[1024, 500], [1280, 600], [1400, 680], [1440, 700], [1600, 780], [1920, 920], [2048, 980], [2560, 1000], [3440, 1200], [3840, 1280]]

[focus]
# While tapping Alt+Tab, a window must keep focus this long (ms) before it counts
# as "used"; windows you only pass over keep their place in the recent order.
lockin_delay = 750
