add_newline = false
format = "$hostname$directory$git_branch$git_status$nix_shell$jobs$cmd_duration$character"
right_format = "$status$time"

[hostname]
format = "[$hostname](#a8a8a8) "

[directory]
format = "[$path$read_only]($style) "
style = "bold"
home_symbol = "~"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bold"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "#a8a8a8"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "#a8a8a8"

[nix_shell]
format = "[ $name]($style) "
style = "#a8a8a8"

[jobs]
format = "[$symbol$number]($style) "
symbol = "󰜎 "
style = "#777777"

[cmd_duration]
format = "[󰔛 $duration]($style) "
style = "#777777"

[status]
disabled = false
format = "[✕ $status]($style) "
style = "#777777"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "#555555"

[character]
success_symbol = "[❯](bold)"
error_symbol = "[❯](#777777)"
vimcmd_symbol = "[❮](bold)"
vimcmd_replace_one_symbol = "[❮](#a8a8a8)"
vimcmd_replace_symbol = "[❮](#a8a8a8)"
vimcmd_visual_symbol = "[❮](#a8a8a8)"
