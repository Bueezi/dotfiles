# Black and white, built around ~:
#   ╭─ ~/.config/sway   main ! 󰔛 2s
#   ╰─❯
# The pill is `inverted` (terminal fg as background), so it's white in dark mode and black in
# light mode; everything else is plain fg or grey.
add_newline = true
format = """
[╭─](#555555)$hostname$directory$git_branch$git_status$nix_shell$jobs$cmd_duration
[╰─](#555555)$character"""
right_format = "$status$time"

# Only over SSH: which machine
[hostname]
format = "[$hostname](#a8a8a8) "

[directory]
format = "[](bold)[ $path$read_only ]($style)[](bold) "
style = "bold inverted"
home_symbol = "~"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bold inverted"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "#a8a8a8"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "#a8a8a8"

[nix_shell]
format = "[ $name]($style) "
style = "#a8a8a8"

[jobs]
format = "[$symbol$number]($style) "
symbol = "󰜎 "
style = "#777777"

[cmd_duration]
format = "[󰔛 $duration]($style) "
style = "#777777"

# Right side: exit code after a failure, and the time
[status]
disabled = false
format = "[✕ $status]($style) "
style = "#777777"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "#555555"

# ❯ in fg, grey after a failed command; ❮ in vim normal mode
[character]
success_symbol = "[❯](bold)"
error_symbol = "[❯](#777777)"
vimcmd_symbol = "[❮](bold)"
vimcmd_replace_one_symbol = "[❮](#a8a8a8)"
vimcmd_replace_symbol = "[❮](#a8a8a8)"
vimcmd_visual_symbol = "[❮](#a8a8a8)"
