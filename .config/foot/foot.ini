[main]
# fish for the interactive shell (bash stays the login shell; fallback if fish is missing)
shell=sh -c 'command -v fish >/dev/null && exec fish || exec bash'
font=Iosevka Nerd Font:size=12
pad=12x12
# initial-color-theme=dark|light, written by darkmode.sh (at login and on every toggle)
include=~/.local/state/foot-theme.ini

[colors-dark]
alpha=0.88
background=000000
foreground=ffffff

[colors-light]
alpha=0.88
background=ffffff
foreground=000000
