[main]
# fish for the interactive shell (bash stays the login shell; fallback if fish is missing)
shell=sh -c 'command -v fish >/dev/null && exec fish || exec bash'
font=Iosevka Nerd Font:size=12
pad=12x12
# Light mode ([colors-light]): fish switches a new window over at startup (config.fish), and
# darkmode.sh signals the running ones

[colors-dark]
alpha=0.80
background=000000
foreground=ffffff

[colors-light]
alpha=0.80
background=ffffff
foreground=000000
