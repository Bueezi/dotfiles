# GTK3 fallback settings (X11 apps without XSETTINGS; Wayland apps read dconf, which darkmode.sh
# switches). Same names as the cursor/icon variables at the top of ~/.config/nixos/sway.nix
[Settings]
gtk-theme-name=Mono-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=20
