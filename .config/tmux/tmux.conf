set -g default-command fish
set -g default-terminal tmux-256color
set -as terminal-features ",foot*:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -s copy-command wl-copy
set -g mode-keys vi
set -g status off
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=white

# C-b is Helix page up
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-N split-window -v -c "#{pane_current_path}"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-z resize-pane -Z
bind -n M-s copy-mode

# One session per foot window, gone when it closes. The pop-up is its own
# session, popup-<id> (popup commands get no formats, $TMUX ends in the id):
# Alt+f detaches from it, so its content stays.
set -g destroy-unattached on
set-hook -g session-closed "run-shell 'tmux kill-session -t popup-#{s/[$]//:hook_session} 2>/dev/null; true'"
bind -n M-f if -F "#{m:popup-*,#{session_name}}" detach-client {
    run-shell "sh ~/.config/tmux/popup-cd.sh '#{session_id}' #{q:pane_current_path}"
    display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
        "TMUX= tmux new-session -A -s popup-\${TMUX##*,} \\; set destroy-unattached off"
}
