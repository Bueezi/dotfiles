# Umbriel (PCs): upstream's packaged config, plus only what's mine below. Included files are
# applied first and this file last: tables merge by key, so the packaged keybinds and rules stay.
# Reloads on save; check with `umbriel config validate`. Reference: https://docs.noctalia.dev/umbriel/
# Noctalia does wallpaper, notifications, night light, idle/lock, clipboard, battery and polkit.

[include]
files = [
  "/run/current-system/sw/share/umbriel/config.toml",   # linked by ~/.config/nixos/noctalia.nix
  # Bundled effect shaders, used under [effects] and [animation] below
  "/run/current-system/sw/share/umbriel/effects/animation/reveal/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/animation/squash/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/animation/workspace_wipe/effect.toml",
]

[include.optional]
files = [
  "~/.local/state/umbriel/hdr.toml",   # DP-2's hdr, written by run.sh hdr (Mod+Shift+H)
  # The cursor, the same as GTK/dconf's (~/.config/nixos/session.nix: cursorTheme, cursorSize)
  "/run/current-system/sw/share/umbriel/cursor.toml",
]

[general]
autostart = [
  "noctalia",
  "librewolf",
  # Desktop only: Concord in a window (it has no tray), Steam in the tray. Laptop only: start muted
  "sh -c 'test -d /sys/class/power_supply/BAT0 || exec foot --app-id=concord concord'",
  "sh -c 'test -d /sys/class/power_supply/BAT0 || exec steam -silent'",
  "sh -c 'test -d /sys/class/power_supply/BAT0 && sleep 2 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 0'",
]

# Outputs: names from `umbriel outputs`
[output.DP-2]
mode = "2560x1440@180"
vrr = "fullscreen"
tearing = true
bit_depth = 10
# hdr: in the state file above (this file is applied last, it would win): "auto" = HDR for fullscreen
# content that has it (games, video), "on" = always. No state file yet = off

[output.eDP-1]
scale = 1.35
bit_depth = 10

[input.touchpad]
tap = true
natural_scroll = true
disable_while_typing = true
scroll_factor = 0.65

[[input.device]]
name = "CX Wireless mouse -1k dongle Mouse"
accel_profile = "flat"
sensitivity = 0.0

# New windows fill the screen; Mod+R still cycles 1/3, 1/2, 2/3
[layout.scrolling]
default_extent_fraction = 1.0

# Eye candy on top of the default animations. Plain solid borders: shader borders (pulse, audio)
# kept the GPU busy at idle. No cursor effect: tried, disliked
[animation.windows_in]
effect = "reveal"
duration_ms = 300
curve = "easeout"

[animation.windows_out]
effect = "reveal"
duration_ms = 250
curve = "easeout"

[animation.windows_move]
effect = "squash"

[animation.workspaces]
style = "reveal"
effect = "workspace_wipe"
duration_ms = 300
curve = "easeout"

# Noctalia's panels, launcher and notifications animate in and out
[animation.layers]
enabled = true

# Dragged windows wobble like a sheet and settle
[animation.windows_drag]
physics = true

# The power menu's terminal (~/.config/wm/scripts/power.sh)
[[window_rule]]
match.app_id = "^scratch-power$"
default_floating = true

# Mod+Shift+Return's terminal: floating
[[window_rule]]
match.app_id = "^foot-float$"
default_floating = true

# Terminals when floating (Mod+Shift+Return, the power menu's, Mod+T): a share of the screen, not
# foot's own small size
[[window_rule]]
match.app_id = "^(foot|foot-float|scratch-power)$"
default_floating_size = { width = 0.6, height = 0.7 }

# Mod+E's yazi: a half-width column beside the current window
[[window_rule]]
match.app_id = "^yazi-side$"
default_scrolling_extent = 0.5

# Floating windows blur what's really behind them. The packaged rule blurs a cached copy of the
# wallpaper (cheap, right for tiled windows: they only sit on the wallpaper), so floating ones
# showed the wallpaper instead of the windows under them
[[window_rule]]
match.is_floating = true
blur_optimized = false

# Yazi (Mod+Shift+E): floating
[[window_rule]]
match.app_id = "^yazi$"
default_floating = true
default_floating_size_px = { width = 1400, height = 850 }

# Terminals at half width beside other windows, 9/10 (centred) while alone on the workspace:
# leaving alone goes back to the rule without is_alone
[[window_rule]]
match.app_id = "^foot$"
default_scrolling_extent = 0.5

[[window_rule]]
match.app_id = "^foot$"
match.is_alone = true
default_scrolling_extent = 0.90

# Games in gamescope (CS2, 4:3 stretched) keep running on a hidden workspace: suspended, gamescope
# stalled and CS2 played only its music, no game sounds
[[window_rule]]
match.app_id = "gamescope"
background_render = true

# Half-width columns for the chat, music and Steam windows, 9/10 (centred) while alone on the
# workspace: leaving alone goes back to the rule without is_alone
[[window_rule]]
match.app_id = ["^ytmusic$", "^vesktop$", "^concord$", "^steam$"]
default_scrolling_extent = 0.5

[[window_rule]]
match.app_id = ["^ytmusic$", "^vesktop$", "^concord$", "^steam$"]
match.is_alone = true
default_scrolling_extent = 0.90

# Added to the packaged binds; menus are Noctalia's. Replaced
# packaged ones: Mod+Escape (quit, now Mod+Shift+M), Mod+Shift+R (width cycle back), Mod+M and
# Mod+Ctrl+F (swapped, below). Kept Umbriel's: Mod+T (float), Mod+P (pin), Mod+O (overview)
[keybinds]
# Mod+M: the column at full width (gaps, border and bar stay); Mod+Ctrl+F: edge to edge, over the bar
"Mod+M" = { action = "window-toggle-maximize", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Return" = { action = "spawn foot", repeat = false }
"Mod+Shift+Return" = { action = "spawn foot --app-id=foot-float", repeat = false }
"Mod+D" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+X" = { action = "spawn ~/.config/umbriel/run.sh focus librewolf librewolf", repeat = false }
"Mod+C" = { action = "spawn ~/.config/umbriel/run.sh focus com.anthropic.Claude claude-desktop", repeat = false }
"Mod+Z" = { action = "spawn ~/.config/umbriel/run.sh game", repeat = false }
"Mod+Shift+D" = { action = "spawn ~/.config/umbriel/run.sh focus concord foot --app-id=concord concord", repeat = false }
"Mod+I" = { action = "spawn ~/.config/umbriel/run.sh focus steam steam", repeat = false }
"Mod+Shift+E" = { action = "spawn foot --app-id=yazi yazi", repeat = false }
"Mod+E" = { action = "spawn foot --app-id=yazi-side yazi", repeat = false }   # beside the current window
"Mod+U" = { action = "spawn librewolf https://toledo.kuleuven.be/portal/", repeat = false }
"Mod+Y" = { action = "spawn ~/.config/umbriel/run.sh toggle ytmusic ytmusic", repeat = false }   # Mod+M is maximize here
"Mod+Shift+S" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Shift+X" = { action = "spawn ~/.config/wm/scripts/screenshot.sh ocr", repeat = false }
"Mod+Shift+R" = { action = "spawn ~/.config/wm/scripts/record.sh", repeat = false }
"Mod+Shift+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Shift+W" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Shift+O" = { action = "spawn ~/.config/umbriel/run.sh slideshow", repeat = false }
"Mod+Shift+P" = { action = "spawn ~/.config/wm/scripts/power.sh", repeat = false }   # with rebuild/update
"Mod+Shift+N" = { action = "spawn noctalia msg panel-toggle control-center network", repeat = false }
"Mod+Shift+B" = { action = "spawn noctalia msg panel-toggle control-center bluetooth", repeat = false }
"Mod+Shift+A" = { action = "spawn noctalia msg panel-toggle control-center audio", repeat = false }
"Mod+Shift+T" = { action = "spawn noctalia msg theme-mode-toggle", repeat = false }
"Mod+Shift+I" = { action = "spawn noctalia msg caffeine-toggle", repeat = false }
"Mod+N" = { action = "spawn noctalia msg nightlight-toggle", repeat = false }
"Mod+Shift+H" = { action = "spawn ~/.config/umbriel/run.sh hdr", repeat = false }
"Mod+Escape" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Shift+M" = "session-quit"
"Print" = { action = "spawn systemctl sleep", repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"Mod+Next" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }
"Mod+Prior" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }
