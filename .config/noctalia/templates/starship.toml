add_newline = false
format = "$hostname$directory$git_branch${custom.main}$git_status$nix_shell$jobs$character"
right_format = "$status$time"

[hostname]
format = "[$hostname]({{colors.on_surface_variant.default.hex}}) "

[directory]
format = "[$path$read_only]($style) "
style = "bold {{colors.primary.default.hex}}"
home_symbol = "~"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bold"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "{{colors.secondary.default.hex}}"
ignore_branches = ["main", "master"]

[custom.main]
when = "git symbolic-ref -q --short HEAD | grep -qx -e main -e master"
shell = ["sh"]
require_repo = true
format = "[]({{colors.secondary.default.hex}}) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "{{colors.tertiary.default.hex}}"

[nix_shell]
format = "[ $name]($style) "
style = "{{colors.tertiary.default.hex}}"

[jobs]
format = "[$symbol$number]($style) "
symbol = "󰜎 "
style = "{{colors.outline.default.hex}}"

[status]
disabled = false
format = "[✕ $status]($style) "
style = "{{colors.error.default.hex}}"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "{{colors.outline.default.hex}}"

[character]
success_symbol = "[❯](bold {{colors.primary.default.hex}})"
error_symbol = "[❯](bold {{colors.error.default.hex}})"
vimcmd_symbol = "[❮](bold {{colors.secondary.default.hex}})"
vimcmd_replace_one_symbol = "[❮]({{colors.tertiary.default.hex}})"
vimcmd_replace_symbol = "[❮]({{colors.tertiary.default.hex}})"
vimcmd_visual_symbol = "[❮]({{colors.tertiary.default.hex}})"
