# Only what differs from the defaults; ~/.local/state/noctalia/settings.toml wins over this file.
# https://docs.noctalia.dev/noctalia/configuration/

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]
pre_action_fade_seconds = 5

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 180

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 190
locked_timeout = 120

[idle.behavior.lock-and-suspend]
action = "command"
command = "~/.config/wm/scripts/idle.sh nap noctalia"
resume_command = "f=$XDG_RUNTIME_DIR/idle-nap.pid; test -f $f && kill $(cat $f); rm -f $f"
enabled = true
timeout = 300

[brightness]
enable_ddcutil = true

[bar.main]
start = ["workspaces"]
end = ["media", "gap",
       "tray", "gap",
       "sysmon", "network", "bluetooth", "volume", "brightness", "battery", "gap",
       "caffeine", "notifications", "gap",
       "session"]

[nightlight]
enabled = true

[location]   # the country, not a city: this repo is public
address = "Belgium"

[lockscreen]
transition_duration = 400

[shell]
umbriel_audio_provider_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.screenshot]
directory = "/home/ben/Downloads"

[theme]
source = "wallpaper"

[hooks]
theme_mode_changed = "~/.config/wm/scripts/darkmode.sh apply"

[wallpaper]
directory = "/home/ben/Documents/sync/wp/active/wallpapers_upscaled"

[wallpaper.automation]
interval_seconds = 300

[widget.gap]
type = "spacer"
length = 16

[widget.network]
show_label = false

[widget.sysmon]   # icon only: hover for the stats, click for the system panel
visualization = "none"
show_value = false

[widget.workspaces]
hide_when_empty = true
