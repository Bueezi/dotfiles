# Only what differs from the defaults; ~/.local/state/noctalia/settings.toml wins over this file.
# https://docs.noctalia.dev/noctalia/configuration/

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]
pre_action_fade_seconds = 5

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 180

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 190
locked_timeout = 120

[idle.behavior.lock-and-suspend]
action = "command"
command = "~/.config/wm/scripts/idle.sh nap noctalia"
resume_command = "f=$XDG_RUNTIME_DIR/idle-nap.pid; test -f $f && kill $(cat $f); rm -f $f"
enabled = true
timeout = 300

[brightness]
enable_ddcutil = true

[bar.main]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = ["media", "audio-vis"]
center = ["workspaces", "privacy"]
end = ["tray", "cpu", "network", "volume", "battery", "separator", "clock", "control-center"]

[nightlight]
enabled = true

[location]   # the country, not a city: this repo is public
address = "Belgium"

[lockscreen]
transition_duration = 400

# Layout for DP-2 (2560x1440); on the laptop Noctalia rescales the positions, not the sizes
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["lockscreen-widget-card-back", "lockscreen-widget-card", "lockscreen-widget-title", "lockscreen-widget-time", "lockscreen-widget-date", "lockscreen-widget-volume", "lockscreen-widget-sysmon", "lockscreen-widget-visualizer", "lockscreen-login-box@DP-2"]

[lockscreen_widgets.widget.lockscreen-widget-card-back]
type = "label"
cx = 1295.0
cy = 793.0
box_width = 480.0
box_height = 370.0
rotation = -0.12
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-card-back.settings]
title = ""
background_color = "surface_container"
background_opacity = 0.6
shadow = false

[lockscreen_widgets.widget.lockscreen-widget-card]
type = "label"
cx = 1280.0
cy = 778.0
box_width = 480.0
box_height = 370.0
rotation = 0.0
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-card.settings]
title = ""
background_opacity = 0.9
shadow = false

[lockscreen_widgets.widget.lockscreen-widget-title]
type = "label"
cx = 1280.0
cy = 550.0
box_width = 320.0
box_height = 50.0
rotation = 0.0
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-title.settings]
title = "L O C K E D"
font_family = "Iosevka Nerd Font Mono"
background = false

[lockscreen_widgets.widget.lockscreen-widget-time]
type = "clock"
cx = 1280.0
cy = 700.0
box_width = 420.0
box_height = 150.0
rotation = 0.0
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-time.settings]
format = "{:%H:%M}"
center_text = true
background = false

[lockscreen_widgets.widget.lockscreen-widget-date]
type = "clock"
cx = 1280.0
cy = 774.0
box_width = 240.0
box_height = 34.0
rotation = 0.0
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-date.settings]
format = "{:%a, %b %d}"
center_text = true
font_family = "Iosevka Nerd Font Mono"
background = false

[lockscreen_widgets.widget.lockscreen-widget-volume]
type = "volume"
cx = 1157.0
cy = 882.0
box_width = 205.0
box_height = 110.0
rotation = 0.0
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-volume.settings]
background_color = "surface_container"

[lockscreen_widgets.widget.lockscreen-widget-sysmon]
type = "sysmon"
cx = 1403.0
cy = 882.0
box_width = 205.0
box_height = 110.0
rotation = 0.0
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-sysmon.settings]
stat = "cpu_usage"
stat2 = "cpu_temp"
background_color = "surface_container"

[lockscreen_widgets.widget.lockscreen-widget-visualizer]
type = "audio_visualizer"
cx = 1280.0
cy = 1105.0
box_width = 760.0
box_height = 110.0
rotation = 0.0
placement_width = 2560.0
placement_height = 1440.0

[lockscreen_widgets.widget.lockscreen-widget-visualizer.settings]
bands = 48
mirrored = true
centered = false
background = false

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
type = "login_box"
output = "DP-2"
cx = 1280.0
cy = 1258.0
box_width = 810.0
box_height = 196.0
placement_width = 2560.0
placement_height = 1440.0

[shell]
umbriel_audio_provider_enabled = true
telemetry_enabled = false

[shell.panel]   # menus from bar icons open under the icon
open_near_click_control_center = true
open_near_click_launcher = true
open_near_click_clipboard = true
open_near_click_wallpaper = true
open_near_click_session = true

[shell.greeter_sync]
auto_sync = true

[shell.screenshot]   # no file: screenshot.sh's Save button writes it
directory = "/home/ben/Downloads"
save_to_file = false
pipe_to_command = true
pipe_command = "~/.config/wm/scripts/screenshot.sh notify"

[theme]
source = "wallpaper"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["btop", "cava", "umbriel"]
enable_community_templates = true
community_ids = ["yazi", "tmux"]

[theme.templates.user.starship]   # STARSHIP_CONFIG in fish points at the output
input_path = "templates/starship.toml"
output_path = "$XDG_CACHE_HOME/noctalia/starship.toml"

# LibreWolf, through Pywalfox (librewolf.nix). Not the community template: its post_action writes ~/.mozilla
[theme.templates.user.pywalfox]
input_path = "templates/pywalfox.json"
output_path = "$XDG_CACHE_HOME/wal/colors.json"
post_hook = "noctalia firefox-theme update"

[hooks]
theme_mode_changed = "~/.config/wm/scripts/darkmode.sh apply"
wallpaper_changed = "ln -sfn \"$NOCTALIA_WALLPAPER_PATH\" ~/.cache/noctalia/wallpaper"   # LibreWolf's new tab (prefs.js)

[wallpaper]
directory = "/home/ben/Documents/sync/wp/active"

[wallpaper.automation]
interval_seconds = 300
recursive = true

[widget.privacy]   # mic, camera, PipeWire screen capture (not wf-recorder)
active_color = "#E5484D"
hide_inactive = true

[widget.network]
show_label = false

[widget.media]
hide_artist = true
hide_album_art = true
hide_when_no_media = true
max_length = 180

[widget.audio-vis]
type = "audio_visualizer"
width = 120
bands = 24
mirrored = false
centered = false

[widget.volume]
show_label = false

[widget.brightness]
show_label = false

[widget.battery]
display_mode = "graphic"

[widget.separator]
type = "text"
text = "│"
color = "on_surface_variant"

[widget.workspaces]
anchor = true
hide_when_empty = true
show_labels = false

[widget.tray]
drawer = true

[widget.control-center]
glyph = "adjustments-horizontal"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "gauge"
show_value = false
